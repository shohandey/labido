<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="labidoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="55%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="labidoGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Background Orbit Arc (Back depth) -->
  <path
    d="M 32 40 C 44 26 78 24 98 38 C 110 47 110 59 96 70"
    fill="none"
    stroke="url(#labidoGrad)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-dasharray="3 3"
    opacity="0.45"
  />

  <!-- Flask Body -->
  <!-- Liquid fill -->
  <path
    d="M 35 68 Q 60 72 85 68 L 90.5 83.5 C 92.5 87.5 89.5 90 85.5 90 L 34.5 90 C 30.5 90 27.5 87.5 29.5 83.5 Z"
    fill="url(#liquidGrad)"
  />
  <!-- Liquid surface line -->
  <path
    d="M 35 68 Q 60 71 85 68"
    fill="none"
    stroke="url(#labidoGlow)"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.8"
  />

  <!-- Flask Outline -->
  <path
    d="M 52 20 L 52 38 L 27.5 85 C 25.5 89 28.5 91.5 33 91.5 L 87 91.5 C 91.5 91.5 94.5 89 92.5 85 L 68 38 L 68 20 Z"
    fill="none"
    stroke="url(#labidoGrad)"
    stroke-width="3.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <!-- Flask Lip -->
  <rect x="48" y="16" width="24" height="4.5" rx="2.25" fill="url(#labidoGrad)" />

  <!-- Molecular Network inside flask -->
  <!-- Connecting lines -->
  <line x1="43" y1="56" x2="60" y2="63" stroke="url(#labidoGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="77" y1="53" x2="60" y2="63" stroke="url(#labidoGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="60" y1="63" x2="60" y2="80" stroke="url(#labidoGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="60" y1="80" x2="42" y2="81" stroke="url(#labidoGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="60" y1="80" x2="78" y2="79" stroke="url(#labidoGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="43" y1="56" x2="42" y2="81" stroke="url(#labidoGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />
  <line x1="77" y1="53" x2="78" y2="79" stroke="url(#labidoGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

  <!-- Molecular Nodes (Atoms) -->
  <circle cx="43" cy="56" r="3.5" fill="url(#labidoGrad)" />
  <circle cx="77" cy="53" r="3.5" fill="url(#labidoGrad)" />
  <circle cx="42" cy="81" r="3.2" fill="url(#labidoGrad)" />
  <circle cx="78" cy="79" r="3.2" fill="url(#labidoGrad)" />
  <circle cx="60" cy="80" r="3.8" fill="url(#labidoGlow)" />

  <!-- Center Four-point Sparkle/Star -->
  <path
    d="M 60 55.5 Q 60 63 52.5 63 Q 60 63 60 70.5 Q 60 63 67.5 63 Q 60 63 60 55.5 Z"
    fill="url(#labidoGlow)"
  />
  <circle cx="60" cy="63" r="1.5" fill="#ffffff" />

  <!-- Front Orbit Swoosh (Wrapping around flask) -->
  <path
    d="M 12 66 C 10 51 32 36 62 33 C 94 30 114 41 112 56 C 110 71 88 84 58 87 C 32 90 14 81 12 66"
    fill="none"
    stroke="url(#labidoGrad)"
    stroke-width="3"
    stroke-linecap="round"
  />
  <!-- Orbit Planetary / Network Nodes -->
  <circle cx="106" cy="46" r="3.2" fill="url(#labidoGlow)" />
  <circle cx="14" cy="72" r="2.8" fill="url(#labidoGrad)" />

  <!-- Secondary subtle accent sparkle -->
  <path
    d="M 94 28 Q 94 32 90 32 Q 94 32 94 36 Q 94 32 98 32 Q 94 32 94 28 Z"
    fill="url(#labidoGlow)"
    opacity="0.9"
  />
</svg>
