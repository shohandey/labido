<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="100%">
  <defs>
    <linearGradient id="fullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="55%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="fullGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="fullLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <!-- ICON (centered horizontally at x=160, y=10 to y=120) -->
  <g transform="translate(100, 10)">
    <!-- Back orbit arc -->
    <path
      d="M 32 40 C 44 26 78 24 98 38 C 110 47 110 59 96 70"
      fill="none"
      stroke="url(#fullGrad)"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-dasharray="3 3"
      opacity="0.45"
    />

    <!-- Liquid fill -->
    <path
      d="M 35 68 Q 60 72 85 68 L 90.5 83.5 C 92.5 87.5 89.5 90 85.5 90 L 34.5 90 C 30.5 90 27.5 87.5 29.5 83.5 Z"
      fill="url(#fullLiquid)"
    />
    <path
      d="M 35 68 Q 60 71 85 68"
      fill="none"
      stroke="url(#fullGlow)"
      stroke-width="1.8"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- Flask Outline -->
    <path
      d="M 52 20 L 52 38 L 27.5 85 C 25.5 89 28.5 91.5 33 91.5 L 87 91.5 C 91.5 91.5 94.5 89 92.5 85 L 68 38 L 68 20 Z"
      fill="none"
      stroke="url(#fullGrad)"
      stroke-width="3.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <rect x="48" y="16" width="24" height="4.5" rx="2.25" fill="url(#fullGrad)" />

    <!-- Bonds -->
    <line x1="43" y1="56" x2="60" y2="63" stroke="url(#fullGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="77" y1="53" x2="60" y2="63" stroke="url(#fullGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="60" y1="63" x2="60" y2="80" stroke="url(#fullGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="60" y1="80" x2="42" y2="81" stroke="url(#fullGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="60" y1="80" x2="78" y2="79" stroke="url(#fullGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" />

    <!-- Nodes -->
    <circle cx="43" cy="56" r="3.5" fill="url(#fullGrad)" />
    <circle cx="77" cy="53" r="3.5" fill="url(#fullGrad)" />
    <circle cx="42" cy="81" r="3.2" fill="url(#fullGrad)" />
    <circle cx="78" cy="79" r="3.2" fill="url(#fullGrad)" />
    <circle cx="60" cy="80" r="3.8" fill="url(#fullGlow)" />

    <!-- Center sparkle -->
    <path
      d="M 60 55.5 Q 60 63 52.5 63 Q 60 63 60 70.5 Q 60 63 67.5 63 Q 60 63 60 55.5 Z"
      fill="url(#fullGlow)"
    />
    <circle cx="60" cy="63" r="1.5" fill="#ffffff" />

    <!-- Front orbit -->
    <path
      d="M 12 66 C 10 51 32 36 62 33 C 94 30 114 41 112 56 C 110 71 88 84 58 87 C 32 90 14 81 12 66"
      fill="none"
      stroke="url(#fullGrad)"
      stroke-width="3"
      stroke-linecap="round"
    />
    <circle cx="106" cy="46" r="3.2" fill="url(#fullGlow)" />
    <circle cx="14" cy="72" r="2.8" fill="url(#fullGrad)" />

    <path
      d="M 94 28 Q 94 32 90 32 Q 94 32 94 36 Q 94 32 98 32 Q 94 32 94 28 Z"
      fill="url(#fullGlow)"
      opacity="0.9"
    />
  </g>

  <!-- TYPOGRAPHY -->
  <!-- "Labido" Wordmark -->
  <text
    x="160"
    y="170"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    font-size="46"
    font-weight="800"
    letter-spacing="-0.5"
    fill="url(#textGrad)"
  >Labido</text>

  <!-- "CAMPUS LAB NETWORK" -->
  <text
    x="160"
    y="202"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="12"
    font-weight="700"
    letter-spacing="4.5"
    fill="#0284c7"
  >CAMPUS LAB NETWORK</text>

  <!-- "INTELLIGENT RESOURCE PLATFORM" -->
  <text
    x="160"
    y="226"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="8.5"
    font-weight="600"
    letter-spacing="3.5"
    fill="#64748b"
  >INTELLIGENT RESOURCE PLATFORM</text>
</svg>
